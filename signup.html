<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Hot Wheels Garage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">HOT WHEELS 🏁</a>
        <a class="nav-link" href="shop.html">Shop Cars</a>
        <a class="nav-link" href="signin.html">Sign In</a>
    </div>
</nav>

<main class="container py-5">
    <div class="content-panel mx-auto" style="max-width:500px">
        <h1 class="section-title">Create Account</h1>
        <p class="muted">Join the Hot Wheels Garage community!</p>

        <form data-demo-form>
            <label class="form-label" for="name">Full Name</label>
            <input class="form-control mb-3" type="text" id="name" required>

            <label class="form-label" for="email">Email Address</label>
            <input class="form-control mb-3" type="email" id="email" required>

            <label class="form-label" for="password">Password</label>
            <input class="form-control mb-3" type="password" id="password" minlength="6" required>

            <button class="btn btn-hot w-100" type="submit">Create Account</button>
        </form>

        <p class="mt-3">Already registered? <a href="signin.html">Sign In</a></p>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
