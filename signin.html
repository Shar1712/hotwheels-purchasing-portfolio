<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Hot Wheels Garage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">HOT WHEELS 🏁</a>
        <a class="nav-link" href="shop.html">Shop Cars</a>
        <a class="nav-link" href="signup.html">Create Account</a>
    </div>
</nav>

<main class="container py-5">
    <div class="content-panel mx-auto" style="max-width:500px">
        <h1 class="section-title">Sign In</h1>
        <p class="muted">Welcome back to your mini garage!</p>

        <form data-demo-form>
            <label class="form-label" for="email">Email Address</label>
            <input class="form-control mb-3" type="email" id="email" required>

            <label class="form-label" for="password">Password</label>
            <input class="form-control mb-3" type="password" id="password" required>

            <button class="btn btn-hot w-100" type="submit">Sign In</button>
        </form>

        <p class="mt-3">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
