<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Hot Wheels Garage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">HOT WHEELS 🏁</a>
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="shop.html">Shop Cars</a>
        <a class="nav-link" href="cart.html">Cart (<span class="cart-count">0</span>)</a>
    </div>
</nav>

<header class="page-head text-center">
    <div class="container">
        <h1>CONTACT US</h1>
        <p class="muted">Have a question about our collection?</p>
    </div>
</header>

<main class="container py-5">
    <div class="content-panel mx-auto" style="max-width:650px">
        <h2 class="section-title">Send Us a Message</h2>
        <form data-demo-form>
            <label class="form-label" for="name">Full Name</label>
            <input class="form-control mb-3" id="name" required>

            <label class="form-label" for="email">Email Address</label>
            <input class="form-control mb-3" type="email" id="email" required>

            <label class="form-label" for="subject">Subject</label>
            <input class="form-control mb-3" id="subject" required>

            <label class="form-label" for="message">Message</label>
            <textarea class="form-control mb-3" id="message" rows="4" required></textarea>

            <button class="btn btn-hot w-100" type="submit">Send Message</button>
        </form>
        <p class="small-note mt-3">Demo form: messages are not actually sent.</p>
    </div>
</main>

<footer class="footer">
    <p>HOT WHEELS GARAGE 🏁</p>
</footer>

<script src="script.js"></script>
</body>
</html>
