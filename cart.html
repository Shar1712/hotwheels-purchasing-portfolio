<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Hot Wheels Garage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">HOT WHEELS 🏁</a>
        <a class="nav-link" href="shop.html">Continue Shopping</a>
        <span>Cart (<span class="cart-count">0</span>)</span>
    </div>
</nav>

<header class="page-head text-center">
    <div class="container">
        <h1>YOUR CART</h1>
        <p class="muted">Your selected cars, all in one place.</p>
    </div>
</header>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-lg-8" id="cartItems"></div>
        <div class="col-lg-4">
            <div class="content-panel">
                <h4>Order Summary</h4>
                <hr>
                <div class="d-flex justify-content-between">
                    <span>Total</span>
                    <strong class="price" id="cartTotal">₹0.00</strong>
                </div>
                <button class="btn btn-hot w-100 mt-3" id="checkoutBtn">Proceed to Checkout</button>
                <p class="small-note mt-3">Demo checkout only. No real payment is processed.</p>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
